<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TILKI CORE</title>
<style>
:root{--bg:#03070b;--panel:#07121a;--line:#133447;--cyan:#58e5ff;--text:#d9f7ff;--muted:#6c8f9f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0a2230 0,#03070b 38%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(#0d223022 1px,transparent 1px),linear-gradient(90deg,#0d223022 1px,transparent 1px);background-size:34px 34px;pointer-events:none}.shell{width:min(1500px,94vw);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand small,.label{color:var(--muted);letter-spacing:.18em;font-size:11px}.brand h1{margin:4px 0;font-size:30px;letter-spacing:.16em}.brand em{font-style:normal;color:var(--cyan)}.status{border:1px solid var(--line);padding:10px 14px;border-radius:999px;color:var(--cyan);font-size:12px}.grid{display:grid;grid-template-columns:1.05fr 1.4fr .85fr;gap:14px}.panel{background:linear-gradient(180deg,#091721e8,#061018e8);border:1px solid var(--line);border-radius:18px;min-height:220px;box-shadow:0 0 40px #00b7ff0c;overflow:hidden}.head{padding:13px 16px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.15em;color:#83a9b9}.voice{padding:28px;text-align:center}.orb{width:190px;height:190px;border-radius:50%;margin:12px auto 26px;display:grid;place-items:center;cursor:pointer;border:1px solid #4ce9ff88;background:radial-gradient(circle,#53e9ff 0 4%,#0d708c 13%,#082a3a 35%,#02070a 65%);box-shadow:0 0 45px #58e5ff44,inset 0 0 50px #58e5ff22;color:#cfffff;font-weight:700;letter-spacing:.15em}.orb.listen{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 70px #58e5ff88}}input{width:100%;padding:14px 16px;background:#02090e;border:1px solid var(--line);border-radius:12px;color:white;outline:none}.row{display:flex;gap:8px;margin-top:10px}.row button,.smallbtn{background:#0a1b26;border:1px solid var(--line);color:#bcefff;border-radius:10px;padding:10px 12px;cursor:pointer}.chat{height:450px;overflow:auto;padding:18px}.msg{max-width:85%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin:10px 0;white-space:pre-wrap}.me{margin-left:auto;background:#0d2430}.ai{background:#071820}.side{display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px}.stat b{font-size:24px;color:var(--cyan)}.list{padding:0 14px 14px;max-height:220px;overflow:auto}.item{padding:10px;border-bottom:1px solid #12303d;color:#ccebf2}.item small{display:block;color:var(--muted);margin-top:3px}.full{grid-column:1/4}.activity{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.act{border:1px solid var(--line);padding:10px;border-radius:10px;color:#a9ccd9}@media(max-width:1000px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.chat{height:330px}}
</style>
</head>
<body>
<div class="shell"><div class="top"><div class="brand"><small>PERSONAL INTELLIGENCE SYSTEM</small><h1>TILKI <em>CORE</em></h1></div><div class="status" id="status">CONNECTING</div></div>
<div class="grid">
<section class="panel"><div class="head">01 // VOICE INTERFACE</div><div class="voice"><button class="orb" id="orb">TAP TO SPEAK</button><div id="heard" style="min-height:24px;color:#88afbd;margin-bottom:18px">Voice channel idle</div><form id="form"><input id="input" placeholder="Type a command or ask anything…"></form><div class="row"><button data-cmd="show my tasks">TASKS</button><button data-cmd="what do you remember">MEMORY</button><button data-cmd="open github">GITHUB</button><button data-cmd="help">HELP</button></div></div></section>
<section class="panel"><div class="head">02 // AGENT CONSOLE</div><div class="chat" id="chat"><div class="msg ai">Systems online. Give me a command.</div></div></section>
<div class="side"><section class="panel"><div class="head">03 // MISSION QUEUE</div><div class="stats"><div class="stat"><b id="open">0</b><small>OPEN</small></div><div class="stat"><b id="done">0</b><small>DONE</small></div><div class="stat"><b id="notesN">0</b><small>MEMORY</small></div></div><div class="list" id="tasks"></div></section><section class="panel"><div class="head">04 // MEMORY VAULT</div><div class="list" id="notes"></div></section></div>
<section class="panel full"><div class="head">05 // ACTIVITY STREAM</div><div class="activity" id="activity"></div></section>
</div></div>
<script>
const $=s=>document.querySelector(s);let state={tasks:[],notes:[],activity:[]};function esc(s=''){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){const open=state.tasks.filter(x=>!x.done);$('#open').textContent=open.length;$('#done').textContent=state.tasks.filter(x=>x.done).length;$('#notesN').textContent=state.notes.length;$('#tasks').innerHTML=state.tasks.slice(0,10).map(x=>`<div class="item">${x.done?'✓ ':'○ '}${esc(x.title)}<small>${x.done?'DONE':'OPEN'}</small></div>`).join('')||'<div class="item">No missions</div>';$('#notes').innerHTML=state.notes.slice(0,8).map(x=>`<div class="item">${esc(x.text)}</div>`).join('')||'<div class="item">Memory empty</div>';$('#activity').innerHTML=state.activity.slice(0,12).map(x=>`<div class="act">${esc(x.text)}</div>`).join('')||'<div class="act">No activity yet</div>'}
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function bubble(role,text){const d=document.createElement('div');d.className='msg '+(role==='me'?'me':'ai');d.textContent=text;$('#chat').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight}async function send(text){text=text.trim();if(!text)return;bubble('me',text);$('#input').value='';try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text})});bubble('ai',d.reply);state=d.state;render();(d.actions||[]).forEach(a=>a.type==='open_url'&&window.open(a.url,'_blank','noopener'));if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(d.reply))}catch(e){bubble('ai','Error: '+e.message)}}$('#form').onsubmit=e=>{e.preventDefault();send($('#input').value)};document.addEventListener('click',e=>{const c=e.target.dataset.cmd;if(c)send(c)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang=navigator.language||'en-US';r.interimResults=false;$('#orb').onclick=()=>{try{$('#orb').classList.add('listen');$('#heard').textContent='Listening…';r.start()}catch{}};r.onresult=e=>{const t=e.results[0][0].transcript;$('#heard').textContent='“'+t+'”';send(t)};r.onend=()=>$('#orb').classList.remove('listen')}else{$('#orb').onclick=()=>alert('Use Chrome or Edge for browser voice recognition.');$('#heard').textContent='Voice recognition unavailable in this browser.'}
(async()=>{try{const h=await api('/api/health');$('#status').textContent=h.aiConfigured?'ONLINE // OPENAI':'ONLINE // LOCAL';state=await api('/api/state');render()}catch{$('#status').textContent='OFFLINE'}})();
</script>
</body></html>
